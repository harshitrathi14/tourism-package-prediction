name: MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  data-registration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data registration
        run: python data_registration.py

  data-preparation:
    runs-on: ubuntu-latest
    needs: data-registration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data preparation
        run: python data_preparation.py

      - name: Upload prepared train/test data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-tourism-data
          path: |
            data/train_data.csv
            data/test_data.csv
          retention-days: 7

  model-building:
    runs-on: ubuntu-latest
    needs: data-preparation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download prepared train/test data
        uses: actions/download-artifact@v4
        with:
          name: prepared-tourism-data
          path: data

      - name: Run model building
        run: python model_building.py

      - name: Commit updated model artifacts
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add model.pkl best_params.json data/train_data.csv data/test_data.csv
          git diff-index --quiet HEAD || (git commit -m "Update trained model artifacts [skip ci]" && git push)
